name: Generate Android keystore

# 一次性任务：为侧载 APK 生成固定签名密钥，产物是可下载的 base64 文本。
# 生成后把内容填进仓库 Secrets：
#   ANDROID_KEYSTORE_BASE64   = keystore.base64.txt 全文
#   ANDROID_KEYSTORE_PASSWORD = 你在下面输入的密码
#   ANDROID_KEY_ALIAS         = 你在下面输入的别名
#   ANDROID_KEY_PASSWORD      = 你在下面输入的密码
# 密钥一旦丢失，已安装的旧包就无法覆盖升级。

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 密钥别名
        required: true
        default: deepseekchat
      password:
        description: 密钥库与密钥密码（至少 6 位）
        required: true
      validity_days:
        description: 有效期（天）
        required: true
        default: '10950'

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate keystore
        env:
          ALIAS: ${{ inputs.alias }}
          PASSWORD: ${{ inputs.password }}
          VALIDITY: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=DeepSeek Chat, O=Personal, C=CN"
          base64 -w0 release.jks > keystore.base64.txt
          {
            echo "### 密钥生成完成"
            echo ""
            echo "- 别名：\`$ALIAS\`"
            echo "- 有效期：$VALIDITY 天"
            echo "- 下载下方 artifact，把 \`keystore.base64.txt\` 全文填进 Secret \`ANDROID_KEYSTORE_BASE64\`"
            echo "- 同时在 Secrets 里填 \`ANDROID_KEYSTORE_PASSWORD\`、\`ANDROID_KEY_ALIAS\`、\`ANDROID_KEY_PASSWORD\`"
            echo "- 用完请删除本 workflow 的运行记录与 artifact，避免密钥长期留存"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore
          path: keystore.base64.txt
          retention-days: 3
